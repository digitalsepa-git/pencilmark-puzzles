name: CI

on:
  pull_request:
  push:
    branches: [main]

# Aynı dalda yeni push gelirse eski koşu iptal edilir. Repo private olduğu için
# Actions dakikası sayılı; boşa koşan iş yok.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: PuzzleKit — derleme ve testler
    # Runner sürümü sabit: `ubuntu-latest` 19 Ekim 2026'da Ubuntu 26'ya geçiyor ve
    # altımızdan değişen bir temel, CI'ın güvenilirliğini bozar. Yükseltme bilinçli
    # bir PR olacak.
    runs-on: ubuntu-24.04
    # macOS runner'ı private repoda 10x dakika harcıyor. PuzzleKit ve GameCore saf
    # Swift, bu yüzden Linux'ta koşuyorlar (ADR 0003). Arayüz işi aşağıda ve yalnız
    # arayüze dokunan PR'larda koşuyor.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v5

      - name: Swift sürümü
        run: swift --version

      - name: Üçüncü parti bağımlılık kontrolü
        # Brief b.9: bağımlılık yüzeyi sıfır tutulur, SPM paketleri dahil.
        # Kural yoruma bırakılmıyor, CI'da kapı.
        #
        # Aranan şey `.package(` çağrısı — dış paket yalnızca böyle bildirilir.
        # Hedeflerin kendi `dependencies:` satırları paket içi bağlantı, dış bağımlılık
        # değil; ilk sürümde onlara da takılıyordu.
        #
        # Kapı repodaki **bütün** Package.swift dosyalarını tarıyor, tek bir yolu değil.
        # Yol bağımlılığı (`.package(path:)`) da reddediliyor: modüller ayrı paketlere
        # değil aynı paketin hedeflerine bölünüyor (ADR 0015), böylece kapı tek kuralda
        # kalıyor ve "sadece yerel" diye açılan bir kapı olmuyor.
        run: |
          status=0
          while IFS= read -r manifest; do
            if grep -qE '\.package\s*\(' "$manifest"; then
              echo "::error file=$manifest::Dış paket bildirimi var. Brief b.9: bağımlılık yüzeyi sıfır."
              status=1
            fi
          done < <(find Packages -name Package.swift)
          if find Packages -name Package.resolved | grep -q .; then
            echo "::error::Package.resolved var, yani bir dış bağımlılık çözülmüş."
            status=1
          fi
          [ "$status" -eq 0 ] && echo "Dış bağımlılık yok."
          exit "$status"

      - name: Derleme
        run: swift build --package-path Packages/PuzzleKit

      - name: Testler
        run: swift test --package-path Packages/PuzzleKit

      - name: Özellik testleri (release)
        # Brief b.11'in 500 bulmaca testleri. Debug derlemede dört varyantın 500'lükleri
        # birlikte dakikalar alıyor, release'te saniyeler — her PR'da o süreyi beklemenin
        # karşılığı yok. Testler `#if !DEBUG` ile debug'da derlenmiyor bile.
        run: |
          swift test --package-path Packages/PuzzleKit -c release \
            --filter "PropertyTests"

      - name: Performans testleri (release)
        # Özellik testlerinden ayrı adım, çünkü paralel yük altında süre ölçümü anlamsız:
        # Kakuro Expert üretimi tek başına 720 ms, 500'lüklerle birlikte 2.606 ms.
        run: |
          swift test --package-path Packages/PuzzleKit -c release \
            --filter "PerformanceTests"

  lint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: SwiftLint (strict)
        # Resmî SwiftLint imajı, sürümü sabit. Üçüncü parti GitHub action
        # kullanmıyoruz: action'lar da bağımlılık ve denetlenmeleri gerekiyor.
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --strict --reporter github-actions-logging

  # macOS dakikası private repoda 10x sayılıyor (ADR 0003), bu yüzden arayüz işi her PR'da
  # değil yalnız arayüze dokunan PR'larda koşuyor. Hangi dosyaların değiştiğini üçüncü parti
  # bir action yerine `git diff` söylüyor: action da denetlenmesi gereken bir bağımlılık.
  changes:
    name: Değişen yollar
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Arayüz dosyası değişmiş mi
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "main'e push: arayüz işi koşuyor."
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "$base...HEAD" \
              | grep -qE '^(App/|Packages/PuzzleKit/Package\.swift|\.github/workflows/ci\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Arayüze dokunulmamış: macOS işi atlanıyor."
          fi

  app:
    name: Uygulama — derleme ve testler
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Runner imajı sabit. Imaj içindeki varsayılan Xcode GitHub tarafından
    # güncellenebiliyor; anlık görüntü testleri geldiğinde (#36) simülatör çalışma zamanı
    # da sabitlenecek, çünkü asıl piksel kararlılığı ona bağlı (ADR 0004).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Ortam
        # Neye karşı derlediğimiz her koşuda log'a yazılıyor: anlık görüntü farkı
        # çıktığında ilk bakılacak yer burası.
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -qi 'iOS'; then
            echo "::error::Runner imajında iOS simülatör çalışma zamanı yok."
            exit 1
          fi

      - name: Derleme ve testler
        # İmzalama kapalı: simülatör derlemesi sertifika istemiyor ve CI'da sertifika
        # tutmak gereksiz bir sır yüzeyi.
        run: |
          xcodebuild test \
            -project App/Pencilmark.xcodeproj \
            -scheme Pencilmark \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
